[package]
name = "cadense-dds-pdf"
version = "0.1.0"
edition = "2024"
description = "CADense Phase 4 Danish Data Sheet (.dds) container, Vector HLR isometric engine, dimension annotations, and Bonn Metal TDS PDF generator"
license = "MIT OR Apache-2.0"

[dependencies]
# CADense workspace crates
cadense-dsf = { path = "../cadense-dsf" }
cadense-order = { path = "../cadense-order" }

# Workspace inherited dependencies
serde.workspace = true
serde_json.workspace = true

# Archive & compression
zip = { version = "2.1", default-features = false, features = ["deflate"] }
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }