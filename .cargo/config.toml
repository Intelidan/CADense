[alias]
xtask = "run --package xtask --"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/NODEFAULTLIB:libcmt.lib"] # Optional if MSVC conflicts arise
# To use LLVM's lld linker on Windows:
# linker = "lld-link"

[target.x86_64-unknown-linux-gnu]
# To use lld on Linux:
linker = "clang"
rustflags = ["-C", "linker-plugin-lto", "-C", "link-arg=-fuse-ld=lld"]
